name: Build KVMem NInfer for RTX 2080 Ti

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

jobs:
  build-llama:
    runs-on: ubuntu-24.04
    container: nvidia/cuda:13.2.0-devel-ubuntu24.04
    env:
      DEBIAN_FRONTEND: noninteractive
    steps:
      - name: Install build dependencies
        run: |
          apt-get update
          apt-get install -y --no-install-recommends git ca-certificates python3 python3-pip ninja-build \
            pkg-config libcurl4-openssl-dev patchelf
          python3 -m pip install --break-system-packages --ignore-installed 'cmake>=3.28,<4'
      - uses: actions/checkout@v4
        with:
          submodules: false
      - name: Trust checkout directory in container
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"
      - name: Prepare official llama.cpp backend
        run: python3 scripts/prepare-backends.py --backend llamacpp
      - name: Configure llama.cpp KVMem
        run: |
          cmake -S . -B build/llama -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_CUDA_ARCHITECTURES=75 \
            -DCMAKE_C_FLAGS='-march=x86-64 -mtune=generic' \
            -DCMAKE_CXX_FLAGS='-march=x86-64 -mtune=generic' \
            -DCMAKE_CUDA_FLAGS='-Xcompiler=-march=x86-64 -Xcompiler=-mtune=generic' \
            -DGGML_CUDA=ON \
            -DGGML_CUDA_FA_QUANTS=all \
            -DBUILD_SHARED_LIBS=OFF \
            -DKVMEM_BUILD_LLAMA=ON \
            -DKVMEM_BUILD_SERVER_TESTS=OFF
      - name: Build llama-kvmem-server
        run: cmake --build build/llama --parallel 2 --target llama-kvmem-server
      - name: Verify llama artifact
        run: |
          test -x build/llama/bin/llama-kvmem-server
          readelf -h build/llama/bin/llama-kvmem-server
          readelf -d build/llama/bin/llama-kvmem-server | grep -E 'libcuda|cudart|cublas|curl' || true
          strings build/llama/bin/llama-kvmem-server | grep -qi kvmem
          printf 'CUDA-linked artifact verified; runtime help check requires NVIDIA driver.\n'
      - name: Package llama artifact and shared libraries
        run: |
          rm -rf dist/llama
          mkdir -p dist/llama/lib
          cp build/llama/bin/llama-kvmem-server dist/llama/
          patchelf --set-rpath '$ORIGIN:$ORIGIN/lib' dist/llama/llama-kvmem-server
          ldd dist/llama/llama-kvmem-server | awk '/=> \// {print $3} /^\// {print $1}' | sort -u | while read -r lib; do
            [ -f "$lib" ] || continue
            case "$(basename "$lib")" in
              libcuda.so*) continue ;;
              libc.so*|libm.so*|libpthread.so*|libdl.so*|librt.so*|ld-linux*.so*|libgcc_s.so*|libstdc++.so*) continue ;;
            esac
            cp -L "$lib" dist/llama/lib/
          done
      - uses: actions/upload-artifact@v4
        with:
          name: kvmem-2080ti-llama-sm75-cuda13
          path: |
            dist/llama/**

  build:
    needs: build-llama
    runs-on: ubuntu-24.04
    container: nvidia/cuda:13.2.0-devel-ubuntu24.04
    env:
      DEBIAN_FRONTEND: noninteractive
    steps:
      - name: Install build dependencies
        run: |
          apt-get update
          apt-get install -y --no-install-recommends git ca-certificates python3 python3-pip ninja-build \
            pkg-config libavformat-dev libavcodec-dev libavutil-dev libswscale-dev libcurl4-openssl-dev patchelf
          python3 -m pip install --break-system-packages --ignore-installed 'cmake>=3.28,<4'
      - uses: actions/checkout@v4
        with:
          submodules: false
      - name: Trust checkout directory in container
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"
      - name: Prepare official KVMem/NInfer baseline
        run: python3 scripts/prepare-backends.py --backend ninfer
      - name: Overlay RTX 2080 Ti Turing kernels
        run: |
          git clone --filter=blob:none https://github.com/mr-september/ninfer-2080ti-22g.git /tmp/ninfer-turing
          git -C /tmp/ninfer-turing checkout 8bc916f0
          git -C /tmp/ninfer-turing diff-tree --no-commit-id --name-only -r 8bc916f0 -- src | while read -r file; do
            case "$file" in
              src/models/qwen3_5/program/planning/startup.cpp) continue ;;
              src/core/pdl.cuh) continue ;;
              src/ops/kernel/sampling_device.cuh) continue ;;
            esac
            mkdir -p "backends/ninfer/$(dirname "$file")"
            cp "/tmp/ninfer-turing/$file" "backends/ninfer/$file"
          done
          sed -E -i 's/\^\(80\|86\|89\|120a\)\$/^(75|80|86|89|120a)$/' backends/ninfer/CMakeLists.txt
          sed -i '/^project(ninfer LANGUAGES C CXX CUDA)$/a add_compile_definitions(NINFER_SM75=1)' backends/ninfer/CMakeLists.txt
          # CUDA redux instructions are unavailable on sm_75. Keep the official
          # sampling implementation/API, but replace only its max reduction with
          # the Turing shuffle implementation.
          if grep -q '__reduce_max_sync' backends/ninfer/src/ops/kernel/sampling_device.cuh; then
            cp /tmp/ninfer-turing/src/ops/common/warp.cuh backends/ninfer/src/ops/common/warp.cuh
            sed -i '1a #include "ops/common/warp.cuh"' backends/ninfer/src/ops/kernel/sampling_device.cuh
            sed -i \
              -e 's/__reduce_max_sync(kMergeMask, high)/warp_reduce_max_u32<kSamplingTileWarps>(kMergeMask, high)/g' \
              -e 's/__reduce_max_sync(kMergeMask, low)/warp_reduce_max_u32<kSamplingTileWarps>(kMergeMask, low)/g' \
              -e 's/__reduce_max_sync(kMergeMask, key)/warp_reduce_max_u32<kSamplingTileWarps>(kMergeMask, key)/g' \
              backends/ninfer/src/ops/kernel/sampling_device.cuh
          fi
          grep -q 'kLog2E' backends/ninfer/src/ops/common/math.h || \
            sed -i '/namespace ninfer::ops {/a inline constexpr float kLog2E = 1.4426950408889634F;' \
              backends/ninfer/src/ops/common/math.h
      - name: Configure
        run: |
          cmake -S backends/ninfer -B build/ninfer -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_CUDA_ARCHITECTURES=75 \
            -DCMAKE_CUDA_FLAGS=-DNINFER_SM75 \
            -DCMAKE_CXX_FLAGS=-DNINFER_SM75 \
            -DNINFER_KVMEM_SOURCE_DIR="$GITHUB_WORKSPACE/kvmem" \
            -DNINFER_BUILD_APPS=ON \
            -DNINFER_BUILD_BENCHMARKS=OFF
      - name: Build ninfer-serve
        run: cmake --build build/ninfer --parallel 2 --target ninfer-serve
      - name: Verify and package artifact
        run: |
          test -x build/ninfer/apps/serve/ninfer-serve
          readelf -h build/ninfer/apps/serve/ninfer-serve
          strings build/ninfer/apps/serve/ninfer-serve | grep -qi kvmem
          rm -rf dist/ninfer
          mkdir -p dist/ninfer/lib
          cp build/ninfer/apps/serve/ninfer-serve dist/ninfer/kvmem-2080ti
          patchelf --set-rpath '$ORIGIN:$ORIGIN/lib' dist/ninfer/kvmem-2080ti
          ldd dist/ninfer/kvmem-2080ti | awk '/=> \// {print $3} /^\// {print $1}' | sort -u | while read -r lib; do
            [ -f "$lib" ] || continue
            case "$(basename "$lib")" in
              libcuda.so*) continue ;;
              libc.so*|libm.so*|libpthread.so*|libdl.so*|librt.so*|ld-linux*.so*|libgcc_s.so*|libstdc++.so*) continue ;;
            esac
            cp -L "$lib" dist/ninfer/lib/
          done
      - uses: actions/upload-artifact@v4
        with:
          name: kvmem-2080ti-sm75-cuda13
          path: |
            dist/ninfer/**
